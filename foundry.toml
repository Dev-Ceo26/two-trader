[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false

[lint]
exclude_lints = [
    "asm-keccak256",
    "calls-loop",
    "low-level-calls",
    "missing-events-access-control",
    "reentrancy-events",
    "custom-errors",
    "arbitrary-send-eth",
    "event-fields",
    "boolean-cst",
    "multi-contract-file"
]

[rpc_endpoints]
twotrader_mainnet = "https://rpc.two-trader.com"
twotrader_testnet = "http://localhost:30334"
